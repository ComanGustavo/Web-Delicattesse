<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deleittese 👨🏾‍🍳 - Menú Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <span class="fs-4 fw-bold">𝕯𝖊𝖑𝖊𝖎𝖙𝖙𝖊𝖘𝖊👨🏾‍🍳</span>
            </a>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                <i class="fas fa-shopping-cart"></i> Mi Pedido <span id="cart-count" class="badge bg-danger">0</span>
            </button>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-center mb-4 text-primary">📍 Menú Premium</h1>
        <div class="d-flex flex-wrap justify-content-center mb-5 gap-2" id="category-buttons"></div>
        <div class="row" id="menu-list"></div>
    </div>

    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h6>Datos del Cliente:</h6>
                    <div class="mb-3">
                        <input type="text" id="cliente-nombre" class="form-control mb-2" placeholder="Nombre completo">
                        <input type="text" id="cliente-tel" class="form-control mb-2" placeholder="Teléfono">
                        <input type="text" id="cliente-dir" class="form-control" placeholder="Dirección de entrega">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Forma de Pago:</label>
                        <select id="forma-pago" class="form-select">
                            <option value="Efectivo">Efectivo al recibir</option>
                            <option value="Transferencia">Transferencia (Mercado Pago)</option>
                        </select>
                    </div>
                    
                    <hr>
                    <h6>Productos:</h6>
                    <ul id="lista-carrito" class="list-group mb-3"></ul>
                
                    <div id="contenedor-boton-mp" class="mt-3 p-3" style="display: none; border: 2px solid #009ee3; border-radius: 10px; background-color: #f0f9ff;">
                        <p class="text-center fw-bold mb-2" style="color: #009ee3;">
                            <i class="fas fa-university"></i> Datos para Transferencia
                        </p>
                        
                        <div class="bg-white p-2 rounded border mb-2 text-center">
                            <small class="text-muted d-block">Alias Mercado Pago:</small>
                            <strong style="font-size: 1.2rem; color: #333; letter-spacing: 0.5px;">facu.deleittese</strong>
                        </div>

                        <div class="bg-white p-2 rounded border mb-2 text-center">
                            <small class="text-muted d-block">Titular:</small>
                            <strong class="d-block">Facundo Omar Torrez</strong>
                        </div>

                        <p class="text-center text-muted small mt-1">
                            Copia el alias, paga desde tu App y luego envía el pedido con el comprobante.
                        </p>
                    </div>

                    <div class="d-flex justify-content-between fw-bold fs-5 mt-3">
                        <span>Total:</span>
                        <span id="total-pago">$0</span>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Seguir comprando</button>
                    <button type="button" class="btn btn-success" onclick="enviarPedidoWhatsApp()"> 
                        <i class="fab fa-whatsapp"></i> Enviar Pedido por WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
