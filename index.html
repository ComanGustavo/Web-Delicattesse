<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deleitesse Local 🍽️ - Menú Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark sticky-top shadow">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold">𝕯𝖊𝖑𝖊𝖎𝖙𝖊𝖘s𝖊 Local 🍽️</span>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-warning btn-sm" onclick="modoAdmin()"><i class="fas fa-user-shield"></i></button>
                <button class="btn btn-primary position-relative" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                    <i class="fas fa-shopping-cart"></i> Pedido 
                    <span id="cart-count" class="badge bg-danger ms-1">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="text-center mb-4">
            <p class="bienvenida-texto">"Excelencia local y sabor auténtico."</p>
            <h1 class="text-primary fw-bold">📍 Menú Premium</h1>
        </div>
        <div id="category-buttons" class="d-flex flex-wrap justify-content-center mb-5 gap-2"></div>
        <div id="menu-list"></div>
    </div>

    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="fas fa-receipt"></i> Tu Pedido</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="number" id="cliente-mesa" class="form-control mb-3 bg-dark text-white border-primary text-center fs-4" placeholder="NÚMERO DE MESA">
                    <ul id="lista-carrito" class="list-group mb-3"></ul>
                    <div class="d-flex justify-content-between fw-bold fs-3 text-warning">
                        <span>Total:</span> <span id="total-pago">$0</span>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button class="btn btn-info w-100 mb-2" onclick="imprimirTicket()"><i class="fas fa-print"></i> Imprimir para Cocina</button>
                    <button class="btn btn-success w-100" onclick="enviarPedidoWhatsApp()"><i class="fab fa-whatsapp"></i> Enviar Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <button onclick="llamarMozo()" class="btn-mozo" title="Llamar al mozo">
        <i class="fas fa-bell"></i>
    </button>

    <footer class="bg-dark py-4 text-center text-white-50 mt-5">
        <p>© 2025 Gustavo Coman WEB. Deleittese Local.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
